name: Package WC Campaign 1.3.0

on:
  push:
    paths:
      - '.github/workflows/package-1.3.0.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build installable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wc-campaign-release
          mkdir -p /tmp/wc-campaign-release/wc-campaign releases
          cp wc-campaign.php /tmp/wc-campaign-release/wc-campaign/
          cp composer.json LICENSE readme.txt /tmp/wc-campaign-release/wc-campaign/
          cp -R src assets templates languages /tmp/wc-campaign-release/wc-campaign/
          (
            cd /tmp/wc-campaign-release
            find wc-campaign -exec touch -t 200001010000 {} +
            find wc-campaign -type d -exec chmod 0755 {} +
            find wc-campaign -type f -exec chmod 0644 {} +
            LC_ALL=C find wc-campaign -print | LC_ALL=C sort | zip -X -q "$GITHUB_WORKSPACE/releases/wc-campaign-1.3.0.zip" -@
          )
          sha256sum releases/wc-campaign-1.3.0.zip | awk '{print $1 "  wc-campaign-1.3.0.zip"}' > releases/wc-campaign-1.3.0.sha256
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          unzip -q releases/wc-campaign-1.3.0.zip -d /tmp/wc-campaign-verify
          test -f /tmp/wc-campaign-verify/wc-campaign/wc-campaign.php
          grep -q 'Version:           1.3.0' /tmp/wc-campaign-verify/wc-campaign/wc-campaign.php
          grep -q "define( 'WOO_CAMPAIGN_VERSION', '1.3.0' )" /tmp/wc-campaign-verify/wc-campaign/wc-campaign.php
          grep -q 'object-fit:contain' /tmp/wc-campaign-verify/wc-campaign/assets/css/presentation-v2-consistency.css
          grep -q '#1f2421' /tmp/wc-campaign-verify/wc-campaign/assets/css/presentation-v2-consistency.css
          find /tmp/wc-campaign-verify/wc-campaign -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find /tmp/wc-campaign-verify/wc-campaign/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit packaged archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/wc-campaign-1.3.0.zip releases/wc-campaign-1.3.0.sha256
          if git diff --cached --quiet; then
            echo 'Release archive already current.'
            exit 0
          fi
          git commit -m 'release: add installable WC Campaign 1.3.0 ZIP'
          git push origin HEAD:main
