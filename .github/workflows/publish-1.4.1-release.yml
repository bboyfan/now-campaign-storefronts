name: Publish WC Campaign 1.4.1 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-1.4.1-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify packaged artifacts
        run: |
          test -f releases/wc-campaign-1.4.1.zip
          test -f releases/wc-campaign-1.4.1.sha256
          sha256sum releases/wc-campaign-1.4.1.zip
          cat releases/wc-campaign-1.4.1.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.1 >/dev/null 2>&1; then
            echo "v1.4.1 already exists; nothing to do."
            exit 0
          fi

          gh release create v1.4.1 \
            releases/wc-campaign-1.4.1.zip \
            releases/wc-campaign-1.4.1.sha256 \
            --target "${GITHUB_SHA}" \
            --title "WC Campaign 1.4.1" \
            --notes "WC Campaign 1.4.1 Bricks integration hardening release. Includes Campaign condition final-authority fixes, Bricks dynamic-data provider support for mixed content and image contexts, query scoping, and template ownership hardening. Download wc-campaign-1.4.1.zip for manual WordPress installation."
