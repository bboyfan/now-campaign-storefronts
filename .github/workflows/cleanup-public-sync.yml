name: Cleanup public sync staging

on:
  push:
    paths:
      - '.github/workflows/cleanup-public-sync.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary sync files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/tmp
          rm -f .github/workflows/cleanup-public-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github
          git commit -m "chore: clean public sync staging"
          git push origin HEAD:main
