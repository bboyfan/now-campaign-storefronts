name: Publish WC Campaign 1.3.0 Release

on:
  push:
    paths:
      - '.github/workflows/publish-1.3.0-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f releases/wc-campaign-1.3.0.zip
          test -f releases/wc-campaign-1.3.0.sha256
          sha256sum -c releases/wc-campaign-1.3.0.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo 'Release v1.3.0 already exists.'
            exit 0
          fi
          gh release create v1.3.0 \
            releases/wc-campaign-1.3.0.zip \
            releases/wc-campaign-1.3.0.sha256 \
            --target main \
            --title 'WC Campaign 1.3.0' \
            --notes 'WC Campaign 1.3.0 public release package. Download wc-campaign-1.3.0.zip for manual WordPress installation. WordPress.org review is still pending.'
